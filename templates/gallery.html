<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Media Tracker — kişisel film, dizi ve anime takip galerisi. Letterboxd tarzı poster duvarı." />
  <title>Media Tracker — Galeri</title>
  <link rel="icon" href="/static/main-logo.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light; }
    html, body, .thin-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar, .thin-scrollbar::-webkit-scrollbar {
      display: none; width: 0; height: 0;
    }
    * { border-radius: 0 !important; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    #recordsPanel[aria-busy="true"] #posterGridWrap { opacity: .6; pointer-events: none; }
    .poster-card {
      position: relative; overflow: hidden; border: 1px solid #27272a;
      background: #18181b; aspect-ratio: 2 / 3; cursor: pointer;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .poster-card:hover {
      border-color: #09090b; transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .poster-card:focus-visible { outline: 2px solid #09090b; outline-offset: 2px; }
    .poster-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .poster-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 0.75rem; color: white; opacity: 0;
      background: linear-gradient(to top, rgba(9,9,11,.98) 0%, rgba(9,9,11,.92) 35%, rgba(9,9,11,.7) 60%, rgba(9,9,11,.2) 80%, rgba(9,9,11,0) 100%);
      transition: opacity .18s ease;
    }
    .poster-card:hover .poster-overlay, .poster-card:focus-visible .poster-overlay { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .poster-card { transition: none; }
      .poster-overlay { transition: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .fade-in { animation: fade-in .18s ease-out both; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-zinc-50 text-zinc-950 antialiased">

  <header class="border-b border-zinc-200 bg-white/95 sticky top-0 z-20 backdrop-blur-sm">
    <div class="mx-auto max-w-[1600px] px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex min-w-0 items-center gap-3">
          <img src="/static/main-logo.svg" alt="Media Tracker Logo" class="size-12 shrink-0 sm:size-14" />
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-bold tracking-tight sm:text-2xl">Media Tracker</h1>
              <span class="border border-zinc-900 bg-zinc-900 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-widest text-white">Galeri</span>
            </div>
            <p id="dbLine" class="mt-0.5 max-w-2xl truncate text-xs text-zinc-500">Veritabanı yükleniyor…</p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="addButton" class="border border-emerald-700 bg-emerald-700 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-white transition hover:bg-emerald-600 active:translate-y-px">
            + Film / Dizi Ekle
          </button>
          <button id="refreshButton" class="border border-zinc-950 bg-zinc-950 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-white transition hover:bg-zinc-800 active:translate-y-px">
            Yenile
          </button>
          <a id="jsonLink" target="_blank" href="/api/records" class="border border-zinc-300 bg-white px-4 py-2 text-xs font-semibold uppercase tracking-wider text-zinc-900 transition hover:border-zinc-950 active:translate-y-px">
            JSON
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-4 py-6 sm:px-6 lg:px-8">

    <!-- Stats -->
    <section aria-label="Genel özet" class="grid border border-zinc-200 bg-white sm:grid-cols-2 lg:grid-cols-4 shadow-sm">
      <article class="border-b border-zinc-200 p-4 sm:border-r lg:border-b-0">
        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Toplam Kayıt</p>
        <p id="statTotal" class="mono mt-2 text-3xl font-bold tracking-tight text-zinc-900">0</p>
      </article>
      <article class="border-b border-zinc-200 p-4 lg:border-b-0 lg:border-r">
        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Ortalama Puan</p>
        <div class="flex items-baseline gap-2 mt-2">
          <p id="statRating" class="mono text-3xl font-bold tracking-tight text-amber-600">-</p>
          <span class="text-xs text-zinc-400">/ 10</span>
        </div>
        <p id="statRatedCount" class="mt-1 text-xs text-zinc-500">0 kayıt puanlandı</p>
      </article>
      <article class="border-b border-zinc-200 p-4 sm:border-r sm:border-b-0">
        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Tamamlanan</p>
        <p id="statCompleted" class="mono mt-2 text-3xl font-bold tracking-tight text-emerald-600">0</p>
      </article>
      <article class="p-4">
        <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Devam Eden</p>
        <p id="statInProgress" class="mono mt-2 text-3xl font-bold tracking-tight text-blue-600">0</p>
      </article>
    </section>

    <!-- Main Grid -->
    <section class="mt-6 grid gap-6 xl:grid-cols-[280px_minmax(0,1fr)]">

      <!-- Sidebar -->
      <aside class="grid gap-4 md:grid-cols-2 xl:block xl:space-y-4">
        <section class="border border-zinc-200 bg-white p-4 shadow-sm">
          <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Puan Dağılımı</h2>
          <div id="ratingChart" class="mt-4 flex h-24 items-end gap-1.5 pt-2" role="img" aria-label="Puan dağılım grafiği"></div>
        </section>
        <div class="contents xl:sticky xl:top-24 xl:block xl:space-y-4">
          <section class="border border-zinc-200 bg-white p-4 shadow-sm">
            <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Tür Filtresi</h2>
            <div id="kindTabs" class="mt-3 grid gap-1.5"></div>
          </section>
          <section class="border border-zinc-200 bg-white p-4 shadow-sm">
            <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Durum Filtresi</h2>
            <div id="statusTabs" class="mt-3 grid gap-1.5"></div>
          </section>
        </div>
      </aside>

      <!-- Records Panel -->
      <section id="recordsPanel" class="min-w-0 border border-zinc-200 bg-white shadow-sm">
        <div class="border-b border-zinc-200 p-4">
          <div class="grid gap-3 lg:grid-cols-[1fr_auto_auto_auto] lg:items-center">
            <label class="block">
              <span class="sr-only">Kayıtlarda ara</span>
              <input id="searchInput" type="search" placeholder="Başlık, not veya yıl ile ara..." class="w-full border border-zinc-300 bg-white px-3 py-2 text-sm outline-none placeholder:text-zinc-400 focus:border-zinc-950" />
            </label>
            <select id="sortSelect" class="border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-950">
              <option value="updated_at">Son Güncelleme</option>
              <option value="created_at">Eklenme</option>
              <option value="title">Başlık</option>
              <option value="rating">Puan</option>
              <option value="release_year">Yıl</option>
              <option value="id">ID</option>
            </select>
            <button id="directionButton" class="border border-zinc-300 bg-white px-3 py-2 text-xs font-semibold uppercase tracking-wider text-zinc-800 transition hover:border-zinc-950 active:translate-y-px">Azalan ↓</button>
            <select id="pageSizeSelect" class="border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-zinc-950">
              <option value="25">25</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <p id="resultLine" aria-live="polite" class="text-xs font-medium text-zinc-600">0 kayıt</p>
            <div class="flex items-center gap-2">
              <button id="prevButton" class="border border-zinc-300 bg-white px-3 py-1 text-xs font-semibold uppercase text-zinc-900 transition hover:border-zinc-950 disabled:opacity-30 disabled:cursor-not-allowed">← Önceki</button>
              <span id="pageLine" class="mono min-w-16 text-center text-xs text-zinc-600">1 / 1</span>
              <button id="nextButton" class="border border-zinc-300 bg-white px-3 py-1 text-xs font-semibold uppercase text-zinc-900 transition hover:border-zinc-950 disabled:opacity-30 disabled:cursor-not-allowed">Sonraki →</button>
            </div>
          </div>
        </div>

        <div id="loadingState" class="hidden p-6"><div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 animate-pulse"><div class="aspect-[2/3] bg-zinc-200"></div><div class="aspect-[2/3] bg-zinc-200"></div><div class="aspect-[2/3] bg-zinc-200"></div><div class="aspect-[2/3] bg-zinc-200"></div><div class="aspect-[2/3] bg-zinc-200"></div><div class="aspect-[2/3] bg-zinc-200"></div></div></div>
        <div id="errorState" class="hidden border-b border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert"></div>
        <div id="emptyState" class="hidden p-16 text-center">
          <p id="emptyTitle" class="text-base font-semibold text-zinc-800">Kayıt bulunamadı</p>
          <p class="mt-1 text-xs text-zinc-500">Filtre veya aramayı değiştirmeyi deneyin.</p>
        </div>
        <div id="posterGridWrap" class="thin-scrollbar min-h-[400px]">
          <div id="posterGrid" class="grid grid-cols-2 gap-3 p-4 sm:grid-cols-3 sm:gap-4 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6"></div>
        </div>
      </section>
    </section>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-xs">
    <div class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto thin-scrollbar border border-zinc-700 bg-zinc-900 text-white shadow-2xl p-6">
      <button onclick="document.getElementById('detailModal').classList.add('hidden');document.getElementById('detailModal').classList.remove('flex')" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl font-bold p-1 z-10">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Add Modal -->
  <div id="addModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-xs">
    <div class="relative w-full max-w-lg max-h-[90vh] overflow-y-auto thin-scrollbar border border-zinc-700 bg-zinc-900 text-white shadow-2xl p-6">
      <div id="addModalContent"></div>
    </div>
  </div>

  <script src="/static/gallery.js"></script>
</body>
</html>
