services:
  gallery:
    build: .
    container_name: media-tracker
    ports:
      - "8766:8766"
    volumes:
      - ./data:/app/data
      - ./static/posters:/app/static/posters
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
    restart: unless-stopped
